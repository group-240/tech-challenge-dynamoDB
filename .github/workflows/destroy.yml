name: 🧹 Destroy DynamoDB Tables - DANGER ZONE

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DESTROY-DYNAMODB" to confirm deletion'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.0

jobs:
  validate-confirmation:
    name: 🔐 Validate Destruction Request
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY-DYNAMODB" ]; then
            echo "❌ Confirmation failed! You must type exactly 'DESTROY-DYNAMODB' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"
          echo "⚠️ WARNING: This will DELETE the DynamoDB tables!"
          echo "⚠️ ALL DATA WILL BE PERMANENTLY LOST!"

  destroy-dynamodb:
    name: 🗑️ Destroy DynamoDB Tables
    runs-on: ubuntu-latest
    needs: validate-confirmation
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📋 List Resources Before Destroy
        run: |
          echo "📊 Resources managed by THIS repository (dynamodb state):"
          terraform state list || echo "No state found"
        continue-on-error: true

      - name: 💥 Terraform Destroy
        run: |
          echo "🗑️ Destroying ONLY resources managed by this Terraform state..."
          echo "This will NOT affect resources from other repositories."
          terraform destroy -auto-approve

      # ⚠️ IMPORTANT: Do NOT add AWS CLI cleanup commands here!
      # This repository should ONLY destroy resources in its Terraform state.
      # Adding AWS CLI commands to delete by name pattern would affect
      # resources from other repositories.

      - name: 📊 Verify Destruction
        if: always()
        run: |
          echo "🔍 Checking remaining resources in Terraform state..."
          terraform state list || echo "✅ All resources destroyed from this state"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 DYNAMODB DESTRUCTION COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Repository: tech-challenge-dynamoDB"
          echo "State Key: dynamodb/terraform.tfstate"
          echo "Resources: DynamoDB Tables"
          echo "Timestamp: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
